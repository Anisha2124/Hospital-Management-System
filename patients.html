<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Patient Management</title>

    <link rel="stylesheet" href="css/patient.css">

</head>

<body>

<div class="container">

    <h1>Patient Management System</h1>

    <form id="patientForm">

        <input
            type="text"
            id="name"
            placeholder="Patient Name"
            required
        >

        <input
            type="number"
            id="age"
            placeholder="Age"
            required
        >

        <select id="gender">

            <option value="Male">Male</option>

            <option value="Female">Female</option>

        </select>

        <input
            type="text"
            id="phone"
            placeholder="Phone"
            required
        >

        <input
            type="text"
            id="disease"
            placeholder="Disease"
            required
        >

        <input
            type="text"
            id="address"
            placeholder="Address"
            required
        >

        <button type="submit">

            Save Patient

        </button>

    </form>

    <br>

    <table>

        <thead>

            <tr>

                <th>Name</th>

                <th>Age</th>

                <th>Gender</th>

                <th>Phone</th>

                <th>Disease</th>

                <th>Address</th>

                <th>Actions</th>

            </tr>

        </thead>

        <tbody id="patientTable"></tbody>

    </table>

</div>

<script src="js/patient.js"></script>

</body>

</html>
